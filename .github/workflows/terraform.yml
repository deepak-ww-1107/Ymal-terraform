name: Terraform Wrapper Pipeline

on:
  push:
    paths:
      - "agents/**/*.yml"
      - "agents/**/*.yaml"
  workflow_dispatch:
    inputs:
      azure_client_id:
        description: "Azure App Registration (service principal) client ID"
        required: true
        type: string
        default: 'da49ac14-f35b-47db-a82e-6e5d7b7f5b21'
      azure_tenant_id:
        description: "Azure tenant ID"
        required: true
        type: string
        default: 'bdcfaa46-3f69-4dfd-b3f7-c582bdfbb820'
      azure_subscription_id:
        description: "Azure subscription ID"
        required: true
        type: string
        default: '7868ce89-bd13-41af-a6d4-560b73c8a1d9'

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ github.event.inputs.azure_client_id || 'da49ac14-f35b-47db-a82e-6e5d7b7f5b21' }}
  ARM_SUBSCRIPTION_ID: ${{ github.event.inputs.azure_subscription_id || '7868ce89-bd13-41af-a6d4-560b73c8a1d9' }}
  ARM_TENANT_ID: ${{ github.event.inputs.azure_tenant_id || 'bdcfaa46-3f69-4dfd-b3f7-c582bdfbb820' }}
  STORAGE_ACCOUNT_ACCESS_KEY: ${{ secrets.STORAGE_ACCOUNT_ACCESS_KEY }}
  TF_VAR_STORAGE_ACCOUNT_ACCESS_KEY: ${{ secrets.STORAGE_ACCOUNT_ACCESS_KEY }}

jobs:
  # Detect every changed agent YAML and run one matrix item per agent folder.
  detect-agents:
    name: Detect Changed Agent YAML Files
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.build-matrix.outputs.changed_files }}
      trigger_context: ${{ steps.build-matrix.outputs.trigger_context }}
      classification_details: ${{ steps.build-matrix.outputs.classification_details }}
      apply_matrix: ${{ steps.build-matrix.outputs.apply_matrix }}
      destroy_matrix: ${{ steps.build-matrix.outputs.destroy_matrix }}
      has_apply: ${{ steps.build-matrix.outputs.has_apply }}
      has_destroy: ${{ steps.build-matrix.outputs.has_destroy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2
        with:
          fetch-depth: 0

      - name: Build matrix from changed agent YAML files
        id: build-matrix
        shell: bash
        run: |
          set -euo pipefail

          BEFORE_SHA=""
          CURRENT_SHA=""

          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"

            if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              mapfile -t CHANGED < <(git ls-files "agents/**/*.yml" "agents/**/*.yaml" | sort -u)
            else
              mapfile -t CHANGED < <(git diff --name-only --diff-filter=AM "${BEFORE_SHA}" "${CURRENT_SHA}" -- "agents/**/*.yml" "agents/**/*.yaml" | sort -u)
            fi
          else
            mapfile -t CHANGED < <(git ls-files "agents/**/*.yml" "agents/**/*.yaml" | sort -u)
          fi

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "changed_files=[]" >> "$GITHUB_OUTPUT"
            echo "classification_details=[]" >> "$GITHUB_OUTPUT"
            echo "trigger_context={\"event_name\":\"${GITHUB_EVENT_NAME}\",\"before_sha\":\"${BEFORE_SHA}\",\"current_sha\":\"${CURRENT_SHA}\",\"changed_count\":0}" >> "$GITHUB_OUTPUT"
            echo "has_apply=false" >> "$GITHUB_OUTPUT"
            echo "has_destroy=false" >> "$GITHUB_OUTPUT"
            echo 'apply_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'destroy_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - "${CHANGED[@]}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          import yaml

          files = [arg.strip() for arg in sys.argv[1:] if arg.strip()]
          apply = []
          destroy = []
          classification = []

          for file_path in files:
            with open(file_path, "r", encoding="utf-8") as f:
              data = yaml.safe_load(f) or {}

            if not isinstance(data, dict):
              raise SystemExit(f"Invalid YAML structure in {file_path}: expected a map/object")

            agent = data.get("agent")
            if not isinstance(agent, str) or not agent.strip():
              raise SystemExit(f"Missing or invalid 'agent' in {file_path}")
            agent = agent.strip()

            destroy_value = data.get("destroy", data.get("Destroy", ""))
            if destroy_value is None:
              destroy_value = ""
            if not isinstance(destroy_value, str):
              raise SystemExit(
                f"Invalid 'destroy' value in {file_path}: expected string equal to agent name or empty"
              )
            destroy_value = destroy_value.strip()

            item = {"agent_yaml": file_path}
            if destroy_value:
              if destroy_value != agent:
                raise SystemExit(
                  f"Destroy guard failed for {file_path}: destroy='{destroy_value}' must match agent='{agent}'"
                )
              destroy.append(item)
              classification.append({
                "agent_yaml": file_path,
                "agent": agent,
                "destroy": destroy_value,
                "route": "destroy",
                "reason": "destroy key is present and matches agent"
              })
            else:
              apply.append(item)
              classification.append({
                "agent_yaml": file_path,
                "agent": agent,
                "destroy": "",
                "route": "apply",
                "reason": "destroy key is empty or missing"
              })

          trigger_context = {
            "event_name": os.getenv("GITHUB_EVENT_NAME", ""),
            "before_sha": os.getenv("BEFORE_SHA", ""),
            "current_sha": os.getenv("CURRENT_SHA", ""),
            "changed_count": len(files)
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"changed_files={json.dumps(files)}\\n")
            out.write(f"classification_details={json.dumps(classification)}\\n")
            out.write(f"trigger_context={json.dumps(trigger_context)}\\n")
            out.write(f"has_apply={'true' if apply else 'false'}\\n")
            out.write(f"has_destroy={'true' if destroy else 'false'}\\n")
            out.write(f"apply_matrix={json.dumps({'include': apply})}\\n")
            out.write(f"destroy_matrix={json.dumps({'include': destroy})}\\n")
          PY
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}

      - name: Show detection summary
        shell: bash
        run: |
          set -euo pipefail

          echo "trigger_context: ${{ steps.build-matrix.outputs.trigger_context }}"
          echo "Changed files: ${{ steps.build-matrix.outputs.changed_files }}"
          echo "classification_details: ${{ steps.build-matrix.outputs.classification_details }}"
          echo "has_apply: ${{ steps.build-matrix.outputs.has_apply }}"
          echo "has_destroy: ${{ steps.build-matrix.outputs.has_destroy }}"
          echo "apply_matrix: ${{ steps.build-matrix.outputs.apply_matrix }}"
          echo "destroy_matrix: ${{ steps.build-matrix.outputs.destroy_matrix }}"

          {
            echo "## Detect Agents Summary"
            echo ""
            echo "Trigger context:"
            echo "\`\`\`json"
            echo '${{ steps.build-matrix.outputs.trigger_context }}'
            echo "\`\`\`"
            echo ""
            echo "Changed files:"
            echo "\`\`\`json"
            echo '${{ steps.build-matrix.outputs.changed_files }}'
            echo "\`\`\`"
            echo ""
            echo "Classification details:"
            echo "\`\`\`json"
            echo '${{ steps.build-matrix.outputs.classification_details }}'
            echo "\`\`\`"
            echo ""
            echo "has_apply: ${{ steps.build-matrix.outputs.has_apply }}"
            echo ""
            echo "has_destroy: ${{ steps.build-matrix.outputs.has_destroy }}"
            echo ""
            echo "Apply matrix:"
            echo "\`\`\`json"
            echo '${{ steps.build-matrix.outputs.apply_matrix }}'
            echo "\`\`\`"
            echo ""
            echo "Destroy matrix:"
            echo "\`\`\`json"
            echo '${{ steps.build-matrix.outputs.destroy_matrix }}'
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-plan:
    name: Terraform Plan
    needs: detect-agents
    if: needs.detect-agents.outputs.has_apply == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-agents.outputs.apply_matrix) }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Azure OIDC parameters
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARM_CLIENT_ID}" || (echo "ARM_CLIENT_ID is empty"; exit 1)
          test -n "${ARM_TENANT_ID}" || (echo "ARM_TENANT_ID is empty"; exit 1)
          test -n "${ARM_SUBSCRIPTION_ID}" || (echo "ARM_SUBSCRIPTION_ID is empty"; exit 1)

      - name: Azure login with OIDC federation
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Extract agent metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          python -c 'import os; from pathlib import Path; import yaml; agent_yaml=Path(os.environ["AGENT_YAML"]); data=yaml.safe_load(open(agent_yaml, "r", encoding="utf-8")); assert isinstance(data, dict); agent=data.get("agent"); assert isinstance(agent, str) and agent.strip(); agent=agent.strip(); agent_dir=str(agent_yaml.parent).replace("\\\\", "/"); tf_workdir=f"{agent_dir}/output"; plan_name=f"{agent}.tfplan"; state_key=f"{agent}/terraform.tfstate"; artifact_name=f"tfplan-{agent}"; plan_summary_file=f"{agent}-plan.txt"; out=open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"); out.write(f"agent={agent}\n"); out.write(f"tf_workdir={tf_workdir}\n"); out.write(f"plan_name={plan_name}\n"); out.write(f"state_key={state_key}\n"); out.write(f"artifact_name={artifact_name}\n"); out.write(f"plan_summary_file={plan_summary_file}\n")'
        env:
          AGENT_YAML: ${{ matrix.agent_yaml }}

      - name: Generate Terraform using Python wrapper
        run: |
          set -euo pipefail
          python app.py "${{ matrix.agent_yaml }}"

      - name: Prepare Terraform files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${{ steps.meta.outputs.tf_workdir }}"

          cat > "${{ steps.meta.outputs.tf_workdir }}/backend.tf" <<'EOF'
          terraform {
            backend "azurerm" {}
            required_providers {
              azurerm = {
                source  = "hashicorp/azurerm"
                version = ">= 3.0"
              }
            }
          }

          provider "azurerm" {
            features {}
          }
          EOF

      - name: Show generated Terraform
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Generated main.tf ====="
          cat "${{ steps.meta.outputs.tf_workdir }}/main.tf"

      - name: Terraform fmt
        run: terraform -chdir="${{ steps.meta.outputs.tf_workdir }}" fmt -recursive

      - name: Terraform init with remote backend
        run: |
          terraform -chdir="${{ steps.meta.outputs.tf_workdir }}" init \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="resource_group_name=${{ secrets.RESOURCE_GROUP }}" \
            -backend-config="key=${{ steps.meta.outputs.state_key }}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform validate
        run: terraform -chdir="${{ steps.meta.outputs.tf_workdir }}" validate

      - name: Terraform plan
        run: |
          terraform -chdir="${{ steps.meta.outputs.tf_workdir }}" plan \
            -out="${{ steps.meta.outputs.plan_name }}"

      # Render the generated plan to a readable text file for reviewers.
      - name: Render plan for review
        run: |
          terraform -chdir="${{ steps.meta.outputs.tf_workdir }}" show -no-color "${{ steps.meta.outputs.plan_name }}" > "${{ steps.meta.outputs.plan_summary_file }}"

      # Publish the plan summary to the GitHub Actions run summary.
      - name: Publish plan summary
        shell: bash
        run: |
          {
            echo "## Terraform Plan - ${{ steps.meta.outputs.agent }}"
            echo ""
            echo "Backend key: ${{ steps.meta.outputs.state_key }}"
            echo ""
            echo "\`\`\`hcl"
            cat "${{ steps.meta.outputs.plan_summary_file }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare plan artifact staging folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plan-artifact"
          cp "${{ steps.meta.outputs.tf_workdir }}/${{ steps.meta.outputs.plan_name }}" "$RUNNER_TEMP/plan-artifact/${{ steps.meta.outputs.plan_name }}"
          cp "${{ steps.meta.outputs.plan_summary_file }}" "$RUNNER_TEMP/plan-artifact/${{ steps.meta.outputs.plan_summary_file }}"
          echo "===== Plan artifact staging debug ====="
          pwd
          ls -R "$RUNNER_TEMP/plan-artifact"

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/plan-artifact/${{ steps.meta.outputs.plan_name }}
            ${{ runner.temp }}/plan-artifact/${{ steps.meta.outputs.plan_summary_file }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove runner-only backend file before commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${{ steps.meta.outputs.tf_workdir }}/backend.tf"
          echo "===== git status after backend cleanup ====="
          git status --short

      - name: Commit generated Terraform output
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_NAME="${GITHUB_REF_NAME}"

          git fetch origin "${BRANCH_NAME}"
          git checkout -B "${BRANCH_NAME}" "origin/${BRANCH_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "${{ steps.meta.outputs.tf_workdir }}/main.tf"

          if git diff --cached --quiet --exit-code; then
            echo "No generated Terraform changes for ${{ steps.meta.outputs.agent }}"
          else
            git commit -m "Update generated Terraform for ${{ steps.meta.outputs.agent }}"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

  terraform-apply:
    name: Terraform Apply
    needs:
      - detect-agents
      - terraform-plan
    if: needs.detect-agents.outputs.has_apply == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-agents.outputs.apply_matrix) }}
    environment:
      name: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Azure OIDC parameters
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARM_CLIENT_ID}" || (echo "ARM_CLIENT_ID is empty"; exit 1)
          test -n "${ARM_TENANT_ID}" || (echo "ARM_TENANT_ID is empty"; exit 1)
          test -n "${ARM_SUBSCRIPTION_ID}" || (echo "ARM_SUBSCRIPTION_ID is empty"; exit 1)

      - name: Azure login with OIDC federation
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Extract agent metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          python -c 'import os; from pathlib import Path; import yaml; agent_yaml=Path(os.environ["AGENT_YAML"]); data=yaml.safe_load(open(agent_yaml, "r", encoding="utf-8")); assert isinstance(data, dict); agent=data.get("agent"); assert isinstance(agent, str) and agent.strip(); agent=agent.strip(); agent_dir=str(agent_yaml.parent).replace("\\\\", "/"); tf_workdir=f"{agent_dir}/output"; plan_name=f"{agent}.tfplan"; state_key=f"{agent}/terraform.tfstate"; artifact_name=f"tfplan-{agent}"; plan_summary_file=f"{agent}-plan.txt"; out=open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"); out.write(f"tf_workdir={tf_workdir}\n"); out.write(f"plan_name={plan_name}\n"); out.write(f"state_key={state_key}\n"); out.write(f"artifact_name={artifact_name}\n"); out.write(f"plan_summary_file={plan_summary_file}\n")'
        env:
          AGENT_YAML: ${{ matrix.agent_yaml }}

      - name: Generate Terraform using Python wrapper
        run: |
          set -euo pipefail
          python app.py "${{ matrix.agent_yaml }}"

      - name: Prepare Terraform files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${{ steps.meta.outputs.tf_workdir }}"

          cat > "${{ steps.meta.outputs.tf_workdir }}/backend.tf" <<'EOF'
          terraform {
            backend "azurerm" {}
            required_providers {
              azurerm = {
                source  = "hashicorp/azurerm"
                version = ">= 3.0"
              }
            }
          }

          provider "azurerm" {
            features {}
          }
          EOF

      - name: Download Terraform plan artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ./plans

      - name: Show downloaded plan artifact contents
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Downloaded artifact debug ====="
          pwd
          ls -R
          ls -R ./plans
          echo "===== Expected plan file ====="
          ls -l "./plans/${{ steps.meta.outputs.plan_name }}"

      - name: Terraform init with remote backend
        run: |
          terraform -chdir="${{ steps.meta.outputs.tf_workdir }}" init \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="resource_group_name=${{ secrets.RESOURCE_GROUP }}" \
            -backend-config="key=${{ steps.meta.outputs.state_key }}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform apply from approved plan
        run: terraform -chdir="${{ steps.meta.outputs.tf_workdir }}" apply -input=false "${{ github.workspace }}/plans/${{ steps.meta.outputs.plan_name }}"

  terraform-destroy-plan:
    name: Terraform Destroy Plan
    needs: detect-agents
    if: needs.detect-agents.outputs.has_destroy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-agents.outputs.destroy_matrix) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Azure OIDC parameters
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARM_CLIENT_ID}" || (echo "ARM_CLIENT_ID is empty"; exit 1)
          test -n "${ARM_TENANT_ID}" || (echo "ARM_TENANT_ID is empty"; exit 1)
          test -n "${ARM_SUBSCRIPTION_ID}" || (echo "ARM_SUBSCRIPTION_ID is empty"; exit 1)

      - name: Azure login with OIDC federation
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Extract agent metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          python -c 'import os; from pathlib import Path; import yaml; agent_yaml=Path(os.environ["AGENT_YAML"]); data=yaml.safe_load(open(agent_yaml, "r", encoding="utf-8")); assert isinstance(data, dict); agent=data.get("agent"); assert isinstance(agent, str) and agent.strip(); agent=agent.strip(); agent_dir=str(agent_yaml.parent).replace("\\\\", "/"); tf_workdir=f"{agent_dir}/output"; destroy_plan_name=f"{agent}-destroy.tfplan"; destroy_summary_file=f"{agent}-destroy-plan.txt"; destroy_artifact_name=f"tfdestroy-{agent}"; state_key=f"{agent}/terraform.tfstate"; out=open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"); out.write(f"agent={agent}\n"); out.write(f"tf_workdir={tf_workdir}\n"); out.write(f"state_key={state_key}\n"); out.write(f"destroy_plan_name={destroy_plan_name}\n"); out.write(f"destroy_summary_file={destroy_summary_file}\n"); out.write(f"destroy_artifact_name={destroy_artifact_name}\n")'
        env:
          AGENT_YAML: ${{ matrix.agent_yaml }}

      - name: Generate Terraform using Python wrapper
        run: |
          set -euo pipefail
          python app.py "${{ matrix.agent_yaml }}"

      - name: Prepare Terraform files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${{ steps.meta.outputs.tf_workdir }}"

          cat > "${{ steps.meta.outputs.tf_workdir }}/backend.tf" <<'EOF'
          terraform {
            backend "azurerm" {}
            required_providers {
              azurerm = {
                source  = "hashicorp/azurerm"
                version = ">= 3.0"
              }
            }
          }

          provider "azurerm" {
            features {}
          }
          EOF

      - name: Terraform init with remote backend
        run: |
          terraform -chdir="${{ steps.meta.outputs.tf_workdir }}" init \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="resource_group_name=${{ secrets.RESOURCE_GROUP }}" \
            -backend-config="key=${{ steps.meta.outputs.state_key }}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform destroy plan
        run: |
          terraform -chdir="${{ steps.meta.outputs.tf_workdir }}" plan -destroy \
            -out="${{ steps.meta.outputs.destroy_plan_name }}"

      - name: Render destroy plan for review
        run: |
          terraform -chdir="${{ steps.meta.outputs.tf_workdir }}" show -no-color "${{ steps.meta.outputs.destroy_plan_name }}" > "${{ steps.meta.outputs.destroy_summary_file }}"

      - name: Publish destroy plan summary
        shell: bash
        run: |
          {
            echo "## Terraform Destroy Plan - ${{ steps.meta.outputs.agent }}"
            echo ""
            echo "Backend key: ${{ steps.meta.outputs.state_key }}"
            echo ""
            echo "\`\`\`hcl"
            cat "${{ steps.meta.outputs.destroy_summary_file }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare destroy plan artifact staging folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/destroy-plan-artifact"
          cp "${{ steps.meta.outputs.tf_workdir }}/${{ steps.meta.outputs.destroy_plan_name }}" "$RUNNER_TEMP/destroy-plan-artifact/${{ steps.meta.outputs.destroy_plan_name }}"
          cp "${{ steps.meta.outputs.destroy_summary_file }}" "$RUNNER_TEMP/destroy-plan-artifact/${{ steps.meta.outputs.destroy_summary_file }}"

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.meta.outputs.destroy_artifact_name }}
          path: |
            ${{ runner.temp }}/destroy-plan-artifact/${{ steps.meta.outputs.destroy_plan_name }}
            ${{ runner.temp }}/destroy-plan-artifact/${{ steps.meta.outputs.destroy_summary_file }}
          if-no-files-found: error
          retention-days: 7

  terraform-destroy-apply:
    name: Terraform Destroy Apply
    needs:
      - detect-agents
      - terraform-destroy-plan
    if: needs.detect-agents.outputs.has_destroy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-agents.outputs.destroy_matrix) }}
    environment:
      name: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Azure OIDC parameters
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARM_CLIENT_ID}" || (echo "ARM_CLIENT_ID is empty"; exit 1)
          test -n "${ARM_TENANT_ID}" || (echo "ARM_TENANT_ID is empty"; exit 1)
          test -n "${ARM_SUBSCRIPTION_ID}" || (echo "ARM_SUBSCRIPTION_ID is empty"; exit 1)

      - name: Azure login with OIDC federation
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Extract agent metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          python -c 'import os; from pathlib import Path; import yaml; agent_yaml=Path(os.environ["AGENT_YAML"]); data=yaml.safe_load(open(agent_yaml, "r", encoding="utf-8")); assert isinstance(data, dict); agent=data.get("agent"); assert isinstance(agent, str) and agent.strip(); agent=agent.strip(); agent_dir=str(agent_yaml.parent).replace("\\\\", "/"); tf_workdir=f"{agent_dir}/output"; destroy_plan_name=f"{agent}-destroy.tfplan"; destroy_artifact_name=f"tfdestroy-{agent}"; state_key=f"{agent}/terraform.tfstate"; out=open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"); out.write(f"agent={agent}\n"); out.write(f"tf_workdir={tf_workdir}\n"); out.write(f"state_key={state_key}\n"); out.write(f"destroy_plan_name={destroy_plan_name}\n"); out.write(f"destroy_artifact_name={destroy_artifact_name}\n")'
        env:
          AGENT_YAML: ${{ matrix.agent_yaml }}

      - name: Generate Terraform using Python wrapper
        run: |
          set -euo pipefail
          python app.py "${{ matrix.agent_yaml }}"

      - name: Prepare Terraform files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${{ steps.meta.outputs.tf_workdir }}"

          cat > "${{ steps.meta.outputs.tf_workdir }}/backend.tf" <<'EOF'
          terraform {
            backend "azurerm" {}
            required_providers {
              azurerm = {
                source  = "hashicorp/azurerm"
                version = ">= 3.0"
              }
            }
          }

          provider "azurerm" {
            features {}
          }
          EOF

      - name: Download destroy plan artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ${{ steps.meta.outputs.destroy_artifact_name }}
          path: ./destroy-plans

      - name: Terraform init with remote backend
        run: |
          terraform -chdir="${{ steps.meta.outputs.tf_workdir }}" init \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="resource_group_name=${{ secrets.RESOURCE_GROUP }}" \
            -backend-config="key=${{ steps.meta.outputs.state_key }}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Terraform destroy from approved plan
        run: terraform -chdir="${{ steps.meta.outputs.tf_workdir }}" apply -input=false "${{ github.workspace }}/destroy-plans/${{ steps.meta.outputs.destroy_plan_name }}"
