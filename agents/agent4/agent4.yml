agent: Exelixis-POC-5

storage_account:
  - name: exelixisstorageacct
    location: westus
    resource_group_name: rg-demo
    account_tier: Standard
    account_replication_type: LRS
    account_kind: StorageV2
    allow_nested_items_to_be_public: false
    default_to_oauth_authentication: false
    tags:
      - key: Project
        value: dev

log_analytics_workspace:
  - name: "law-eva-fet"
    location: "West US"
    resource_group_name: "rg-demo"
    tags:
      Project: "Exelixis"

search_service:
  - name: "srch-eva-dev"
    location: "West US"
    resource_group_name: "rg-demo"
    sku: "basic"
    semantic_search_sku: "free"
    network_rule_bypass_option: "None"
    tags:
      Project: "Exelixis"

application_insights:
  - name: "appi-eva-dev"
    location: "West US"
    resource_group_name: "rg-demo"
    application_type: "web"
    sampling_percentage: 100
    tags:
      Project: "Exelixis"
                   
service_plan:
  - name: "asp-eva-dev"
    location: "West US"
    resource_group_name: "rg-demo"
    os_type: "Linux"
    sku_name: "F1"
    tags:
      Project: "Exelixis"

linux_function_app:
  - name: "func-linux-eva-dev"
    location: "West US"
    resource_group_name: "rg-demo"
    service_plan_id: module.service_plan_1.id
    storage_account_name: module.storage_account_1.name
    storage_account_access_key: module.storage_account_1.primary_access_key
    application_insights_connection_string: module.application_insights_1.connection_string 

    # service_plan_id: "/subscriptions/7868ce89-bd13-41af-a6d4-560b73c8a1d9/resourceGroups/rg-demo/providers/Microsoft.Web/serverFarms/asp-eva-dev"
    # storage_account_name: "umartesting675"
    # storage_account_access_key: "${STORAGE_ACCOUNT_ACCESS_KEY}"
    # application_insights_connection_string: "InstrumentationKey=e06bc7e6-a3ef-4f85-8684-0a07b51334e3;IngestionEndpoint=https://eastus-8.in.applicationinsights.azure.com/;LiveEndpoint=https://eastus.livediagnostics.monitor.azure.com/;ApplicationId=61a7c441-edb0-48f6-883e-048c9b2ecefc"
    https_only: true
    builtin_logging_enabled: true
    client_certificate_mode: "Optional"
    ftps_state: "Disabled"
    python_version: "3.11"
    allowed_origins:
      - "*"

    app_settings:
      FUNCTIONS_WORKER_RUNTIME: "python"
      WEBSITE_RUN_FROM_PACKAGE: "1"
    tags:
      Project: "Exelixis"


windows_function_app:
  - name: "func-windows-eva-dev"
    location: "West US"
    resource_group_name: "rg-demo"
    service_plan_id: module.service_plan_1.id
    storage_account_name: module.storage_account_1.name
    storage_account_access_key: module.storage_account_1.primary_access_key
    application_insights_connection_string: module.application_insights_1.connection_string
    https_only: true
    builtin_logging_enabled: true
    client_certificate_mode: "Optional"
    ftps_state: "Disabled"
    ip_restriction_default_action: "Allow"
    allowed_origins:
      - "*"
      
    app_settings:
      FUNCTIONS_WORKER_RUNTIME: "dotnet"
      WEBSITE_RUN_FROM_PACKAGE: "1"
    tags:
      Project: "Exelixis"
      